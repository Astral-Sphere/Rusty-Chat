[workspace]
# Standalone workspace: builds for wasm32-unknown-unknown; excluded from the
# root workspace to keep wasm-only dependency graphs from unifying with
# native ones (see docs/ARCHITECTURE.md §5).

[package]
name = "rusty-chat-web"
description = "Rusty-Chat Dioxus frontend (CSR, wasm32)"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
gloo-net = "0.7.0"
serde = "1.0.229"
serde_json = "1.0.151"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Window", "Storage", "Location", "ErrorEvent", "CloseEvent", "BinaryType"] }
comrak = { version = "0.55.0", default-features = false }
katex-rs = { version = "0.3.0", features = ["wasm"] }
ammonia = "4.2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
