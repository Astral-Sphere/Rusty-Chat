[package]
name = "rc-core"
description = "Rusty-Chat shared types: DTOs, realtime event protocol, errors, timestamp policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
sea-orm = { workspace = true, optional = true }
regex = "1.13.1"

[features]
# `sea-orm` enables `From<sea_orm::DbErr> for Error` so repositories can use `?`.
sea-orm = ["dep:sea-orm"]
