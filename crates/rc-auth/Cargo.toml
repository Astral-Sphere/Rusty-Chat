[package]
name = "rc-auth"
description = "Rusty-Chat authentication: JWT (HS256), bcrypt/argon2 password hashing, sk- API keys, duration parsing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash", "rand_core"] }
bcrypt = "0.19.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand.workspace = true
rc-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true }
