[package]
name = "rc-llm"
description = "Rusty-Chat LLM integration: Ollama/OpenAI/Responses-API streaming state machines, payload conversion, OR-style output items, model registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
futures.workspace = true
rc-core = { workspace = true }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio = { workspace = true, features = ["full"] }
