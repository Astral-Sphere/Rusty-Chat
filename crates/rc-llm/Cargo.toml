[package]
name = "rc-llm"
description = "Rusty-Chat LLM integration: Ollama/OpenAI/Responses-API streaming state machines, payload conversion, OR-style output items, model registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
futures.workspace = true
openai-interface = "0.12.0"
rc-core = { workspace = true }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde.workspace = true
tracing.workspace = true
uuid = { workspace = true }
serde_json.workspace = true
bytes = "1.12.1"

[dev-dependencies]
axum = "0.8.9"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["reasoning"]
# `reasoning` mirrors openai-interface's gate for the de-facto-standard
# reasoning_content field (default-on upstream; kept explicit here so a
# default-features=false build still compiles).
reasoning = ["openai-interface/reasoning"]
