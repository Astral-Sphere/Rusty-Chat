[package]
name = "rusty-chat"
description = "Rusty-Chat server binary: CLI (serve/migrate-check/reindex/create-admin), axum assembly, embedded frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "rusty-chat"
path = "src/main.rs"

[dependencies]
rc-core = { workspace = true }
rc-db = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
tower-http = { workspace = true, features = ["cors", "fs"] }
rand = { workspace = true }
serde = "1"
serde_json = "1"
rc-auth = { version = "0.1.0", path = "../rc-auth" }
sea-orm.workspace = true
sqlx.workspace = true
rc-llm = { version = "0.1.0", path = "../rc-llm" }
reqwest = { version = "0.13.5", features = ["json", "stream"] }

[dev-dependencies]
http = "1.5.0"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { workspace = true, features = ["util"] }
