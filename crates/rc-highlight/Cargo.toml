[package]
name = "rc-highlight"
description = "Rusty-Chat server-side syntax highlighting: tree-sitter + zed highlights.scm query assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
streaming-iterator = "0.1.9"
tree-sitter = "0.27.0"
